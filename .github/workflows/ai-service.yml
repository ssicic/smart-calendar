name: ai-service

on:
  push:
    paths: ["ai-service/**", ".github/workflows/ai-service.yml"]
  pull_request:
    paths: ["ai-service/**"]
  # Evals call Claude (about 1 cent a run), so they run on demand:
  # Actions → ai-service → Run workflow. Needs the ANTHROPIC_API_KEY repo secret.
  workflow_dispatch:
    inputs:
      repeat:
        description: "Runs per eval case"
        default: "1"

defaults:
  run:
    working-directory: ai-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Eval harness (demo model, no API calls)
        run: python -m evals.run --fake --out /tmp/fake.md || true
      - name: Ask-your-weeks evals (fake or cached embeddings, demo model)
        run: python -m evals.rag_run --fake --out /tmp/rag.md

  evals:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Evals (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: python -m evals.run --repeat ${{ inputs.repeat }}
      - name: Results on the run page
        if: always()
        run: cat evals/results.md >> "$GITHUB_STEP_SUMMARY"
